name: heartrisk-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src
  PYTHON_VERSION: "3.13"

jobs:
  lint-test-train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 . --count --statistics

      - name: Unit tests (pytest)
        run: |
          mkdir -p ci-artifacts
          pytest -q --junitxml=ci-artifacts/pytest-report.xml 2>&1 | tee ci-artifacts/pytest.log
          exit ${PIPESTATUS[0]}

      - name: Fetch dataset (falls back to the committed copy)
        run: python scripts/download_data.py --skip-if-exists

      - name: Clean data
        run: python scripts/prepare_data.py 2>&1 | tee ci-artifacts/prepare_data.log

      - name: EDA figures
        run: python -m heartrisk.eda --log-mlflow 2>&1 | tee ci-artifacts/eda.log

      - name: Train, tune and track with MLflow
        run: python -m heartrisk.train 2>&1 | tee ci-artifacts/train.log

      - name: Model quality gate (fails the pipeline below ROC-AUC 0.80)
        run: python scripts/check_metrics.py --min-auc 0.80 2>&1 | tee ci-artifacts/quality_gate.log

      - name: Upload training outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-outputs-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            ci-artifacts/
            models/
            reports/
            data/processed/
            mlflow.db
            mlartifacts/

  docker:
    needs: lint-test-train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download trained model from the previous job
        uses: actions/download-artifact@v4
        with:
          name: training-outputs-${{ github.run_number }}
          path: trained

      - name: Use the freshly trained model in the image
        run: cp trained/models/* models/

      - name: Build image
        run: docker build -t heartrisk-api:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name hr -p 8000:8000 heartrisk-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}' \
            | tee docker-smoke-response.json
          python -c "import json; r=json.load(open('docker-smoke-response.json')); assert r['prediction'] in (0,1) and 0.5 <= r['confidence'] <= 1"
          docker logs hr > docker-container.log
          docker rm -f hr

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-${{ github.run_number }}
          path: |
            docker-smoke-response.json
            docker-container.log
