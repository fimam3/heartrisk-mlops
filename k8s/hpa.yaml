# Scales the API between 2 and 5 pods on CPU (needs metrics-server:
# `minikube addons enable metrics-server`).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: heartrisk-api
  namespace: heartrisk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: heartrisk-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
